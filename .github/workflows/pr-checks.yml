name: pr-checks

# Lightweight PR-time checks for the lab itself (not the upstream
# baseline). Catches the things reviewers should not have to
# hand-check on every PR: trailing whitespace, large generated
# artifacts, accidental writes into baseline/, missing required
# docs, action-pin policy. Action refs are pinned to 40-char SHAs.

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Disallow changes inside baseline/
        run: |
          if git diff --name-only --diff-filter=ACMRT "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"..HEAD | grep -E '^baseline/'; then
            echo "::error::PR modifies files inside baseline/. baseline/ is a read-only snapshot."
            echo "::error::Refresh the snapshot via a dedicated upstream-sync branch instead."
            exit 1
          fi

      - name: Block generated credentials
        run: |
          # Check 1: tracked file names. Catches `git add -f <name>`
          # where the contributor forced an ignored file into the index.
          if git ls-files | grep -E '(^|/)bridge-config\.generated\.js$|(^|/)\.env($|\.)|BridgeTLS/ResonantOS_User/'; then
            echo "::error::Tracked file appears to be a generated credential or runtime state artifact."
            echo "::error::These names are .gitignore-excluded by design; do not force-add them."
            exit 1
          fi
          # Check 2: working-tree presence. Catches the case where a
          # generated file is in the working tree but never staged.
          wt_hits=$(git ls-files --others --exclude-standard 2>/dev/null | grep -E '(^|/)bridge-config\.generated\.js$|(^|/)\.env($|\.)|BridgeTLS/ResonantOS_User/' || true)
          if [ -n "$wt_hits" ]; then
            echo "::error::Generated credential or runtime state artifact present in working tree but not staged:"
            echo "$wt_hits"
            echo "::error::Delete the local file; it is in .gitignore on purpose."
            exit 1
          fi
          # Check 3: high-entropy credential shapes in the diff. Skip
          # baseline/ (upstream test fixtures like
          # sk-EXAMPLEEXAMPLEEXAMPLE are deliberately present there) and
          # docs/reviews/ (the audit reports themselves quote those
          # fixtures).
          base="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          diff_hits=$(git diff "$base"..HEAD --diff-filter=ACMRT \
            -- . ':!baseline' ':!docs/reviews' 2>/dev/null \
            | grep -nE 'ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{32,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}' || true)
          if [ -n "$diff_hits" ]; then
            echo "::error::Possible high-entropy credential shape detected in the diff:"
            echo "$diff_hits"
            echo "::error::If this is a test fixture, use a clearly fake value like 'sk-EXAMPLEEXAMPLEEXAMPLE'."
            exit 1
          fi

      - name: Reject large diff blobs
        run: |
          # Threshold: 256KB per file. The intent is to catch accidentally
          # committed binary blobs or generated artifacts, not to gate on
          # prose length. Prior versions used `git diff --numstat` which
          # reports line counts in this configuration, leading to false
          # positives for long-form documents.
          base="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          max_bytes=$((256 * 1024))
          files=$(git diff --name-only --diff-filter=ACMRT "$base"..HEAD)
          bad=""
          for f in $files; do
            if [ -f "$f" ]; then
              size=$(wc -c < "$f" | tr -d ' ')
              if [ "$size" -gt "$max_bytes" ]; then
                bad="$bad\n$f: ${size} bytes (max ${max_bytes})"
              fi
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::Files exceeding 256KB added in this PR:"
            printf '%b' "$bad"
            exit 1
          fi

      - name: Trailing-whitespace check
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          # Explicit grep instead of `git diff --check`, whose behavior
          # changed in git 2.54 in ways that produce inconsistent results.
          files=$(git diff --name-only --diff-filter=ACMRT "$base"..HEAD)
          bad=""
          for f in $files; do
            if [ -f "$f" ]; then
              ws=$(grep -nE ' +$' "$f" || true)
              if [ -n "$ws" ]; then
                bad="$bad\n$f:\n$ws\n"
              fi
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::Trailing whitespace detected:"
            printf '%b' "$bad"
            exit 1
          fi

  pin-policy:
    name: Action pin policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: 'Verify uses: references are 40-char SHAs'
        run: |
          bad=$(grep -RhoE "uses:[[:space:]]+[A-Za-z0-9_.-]+@[0-9a-f]{1,39}([^0-9a-f]|$)" .github/workflows || true)
          if [ -n "$bad" ]; then
            echo "::error::Short-SHA action pin detected:"
            echo "$bad"
            exit 1
          fi
          echo "All action refs are pinned to 40-char SHAs."

  docs-routing:
    name: Docs router presence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify required docs exist
        run: |
          for f in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md SUPPORT.md \
                   docs/VISION.md docs/ARCHITECTURE.md docs/MILESTONES.md docs/WORKFLOW.md \
                   docs/decisions/README.md; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty required file: $f"
              exit 1
            fi
          done
      - name: Verify ADR parity between decisions/ and the LaTeX decisions section
        run: |
          # Every ADR under docs/decisions/ must be enumerated in
          # docs/decisions/README.md AND in latex/sections/05-decisions.tex.
          # This is the cheap drift detector for F-01 / F-03.
          adrs=$(ls docs/decisions/[0-9][0-9][0-9][0-9]-*.md 2>/dev/null | grep -v '/README.md$' || true)
          if [ -z "$adrs" ]; then
            echo "::error::No ADR files found under docs/decisions/."
            exit 1
          fi
          missing=""
          for f in $adrs; do
            base=$(basename "$f" .md)
            num=$(echo "$base" | grep -oE '^[0-9]{4}')
            if ! grep -q "\[$num\]" docs/decisions/README.md; then
              missing="$missing $f (not in docs/decisions/README.md)"
            fi
            if ! grep -q "\\\\adr{$num}" latex/sections/05-decisions.tex; then
              missing="$missing $f (not in latex/sections/05-decisions.tex)"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::ADR parity broken. Missing from one or both index surfaces:"
            echo "$missing"
            exit 1
          fi
      - name: Verify docs/ <-> latex/sections/ source-of-truth parity
        run: |
          # Every docs/*.md in the four-pair list must be named as
          # 'Source of truth' by at least one latex/sections/*.tex
          # file. The Markdown file does not need to reference the
          # LaTeX file by path; the LaTeX side is the authority.
          broken=""
          for md in docs/VISION.md docs/MILESTONES.md docs/ARCHITECTURE.md; do
            if [ ! -f "$md" ]; then
              continue
            fi
            if ! grep -lqF "Source of truth: $md" latex/sections/*.tex 2>/dev/null; then
              broken="$broken\n$md is not named as 'Source of truth' by any latex/sections/*.tex file."
            fi
          done
          # Reverse: every latex/sections/*.tex that names a docs/*.md
          # as 'Source of truth' must reference an existing file.
          for tex in latex/sections/*.tex; do
            src=$(echo "$tex" | grep -oE 'docs/[A-Za-z0-9_./-]+\.md' || true)
            if [ -n "$src" ] && [ ! -f "$src" ]; then
              broken="$broken\n$tex names $src as Source of truth but that file does not exist."
            fi
          done
          if [ -n "$broken" ]; then
            echo "::error::docs/ <-> latex/sections/ parity broken:"
            printf '%b' "$broken"
            exit 1
          fi


  latex-presence:
    name: LaTeX scaffold presence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify LaTeX scaffold is present
        run: |
          for f in latex/README.md latex/Makefile latex/latexmkrc latex/main.tex; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty required file: $f"
              exit 1
            fi
          done

  bridge-policy:
    name: Bridge policy conformance (ADR-0005)
    # ADR-0005 is the lab's policy; the code change is upstream's.
    # This check is the lab's drift detector. Until upstream merges
    # the policy (see docs/reviews/2026-08-12-bridge-policy-upstream.md),
    # the baseline/ file is non-compliant; the check logs a warning
    # rather than blocking. Promote to blocking once the upstream
    # patch lands and the lab's baseline/ snapshot is refreshed.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify bridge loopback exemption and LAN startup guard policy
        run: |
          # ADR-0005: the baseline/ bridge server must (a) default
          # the loopback open-path exemption to [/hermes-dashboard]
          # only and (b) refuse to start on a non-loopback bind with
          # an empty IP allowlist. The lab is the policy author; the
          # code change is upstream's. This check is the lab's drift
          # detector for upstream's adoption of the policy.
          target="baseline/browser-first/host/bridge-server.mjs"
          if [ ! -f "$target" ]; then
            echo "::error::ADR-0005: $target not found."
            exit 1
          fi
          broken=""
          # (a) loopback exemption default is /hermes-dashboard.
          if ! grep -q 'return \["/hermes-dashboard"\]' "$target" && \
             ! grep -q "return \['/hermes-dashboard'\]" "$target"; then
            broken="$broken\n$target does not default the loopback open-path exemption to [/hermes-dashboard] (ADR-0005 Tier 1)."
          fi
          if grep -E 'DASHBOARD_PROXY_MIRROR_PATHS\.map\(\(entry\) => entry\.bridge\)' "$target" | grep -v -E '^\s*//' > /dev/null; then
            broken="$broken\n$target still maps the full DASHBOARD_PROXY_MIRROR_PATHS list into the default open-path exemption (should be [/hermes-dashboard] only)."
          fi
          # (b) startBridgeServer refuses to start on a non-loopback
          # bind with empty allowedCidrs.
          if ! grep -q 'BRIDGE_REFUSE_LAN_NO_CIDRS' "$target"; then
            broken="$broken\n$target does not refuse to start on a non-loopback bind with empty allowedCidrs (ADR-0005 Tier 2)."
          fi
          if [ -n "$broken" ]; then
            echo "::warning::ADR-0005: bridge policy drift in $target:"
            printf '%b' "$broken"
            echo "::warning::See docs/reviews/2026-08-12-bridge-policy-upstream.md for the proposed upstream patch."
            # Drift is the expected pre-adoption state. exit 0 so
            # the check stays green until the upstream patch lands
            # and the lab's baseline/ snapshot is refreshed; then
            # change this to exit 1 to make the check blocking.
            exit 0
          fi
