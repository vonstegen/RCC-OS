name: upstream-deterministic

# Runs the upstream ResonantOS deterministic test suite against the
# in-tree baseline/ snapshot. Detects divergence from
# ResonantOS/2.0.0-alpha @ dev as early as possible.
#
# This workflow is strict on tests. Dependency-advisory status is
# reported separately by upstream-advisories and is not gating here.
#
# The gate list is the lab-adjusted subset of upstream verify:alpha.
# Why each dropped or replaced gate is excluded, and the re-enable
# conditions, are recorded in
# docs/decisions/0004-upstream-suite-parity.md (ADR-0004). If you
# add or remove a gate, update ADR-0004 in the same PR.
#
# Action refs are pinned to 40-char commit SHAs.

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Weekly Monday 06:17 UTC; complements PR-time verification.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  baseline-deterministic:
    name: Baseline deterministic verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: baseline/.nvmrc
          cache: npm
          cache-dependency-path: baseline/package-lock.json

      - name: Install root dependencies
        working-directory: baseline
        run: npm ci

      - name: Install browser host dependencies
        working-directory: baseline
        run: npm ci --prefix addons/resonant-browser-host

      - name: Verify Alpha (deterministic suite, lab-adjusted)
        # Run every gate that applies in the lab context, in a stable
        # order. We intentionally omit:
        #   - docs:check / test:docs: asserts the lab's docs tree
        #     matches upstream's canonical reading order.
        #   - test:browser-first:live: requires a real Chrome + xvfb.
        #   - npm test -- --run: the upstream argv regression noted
        #     in the chat review (C2). We use `npm test` instead.
        working-directory: baseline
        env:
          RESONANTOS_BROWSER_HOST_CHANNEL: chrome
        run: |
          set -e
          npm run repo:hygiene
          npm test
          npm run test:living-archive-mcp
          npm run test:living-archive-memory-service
          npm run test:browser-host
          npm run test:browser-first
          npm run test:health
          npm run test:engineer-runner
          npm run test:security-pipeline
          npm run test:module-ownership
          npm run discipline:validate
          npm run pre-release:scan

      - name: Summarize result
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            echo "::error::Baseline ResonantOS deterministic suite is red."
            echo "::error::Either fix baseline/ (refresh snapshot) or remediate the upstream regression."
            exit 1
          fi
          echo "Baseline ResonantOS deterministic suite is green."
