name: latex-build

# Builds the LaTeX documentation layer with TeX Live (pdflatex +
# latexmk + biber) and uploads the resulting PDF as a workflow
# artifact. Action refs are pinned to 40-char SHAs.

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - 'latex/**'
      - 'docs/**'
      - '.github/workflows/latex-build.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'latex/**'
      - 'docs/**'
      - '.github/workflows/latex-build.yml'
  workflow_dispatch:

jobs:
  build-pdf:
    name: Build RCC-OS PDF
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-science \
            texlive-publishers \
            texlive-bibtex-extra \
            biber \
            latexmk \
            make \
            poppler-utils \
            lmodern

      - name: Build
        working-directory: latex
        run: make

      - name: Verify PDF was produced
        working-directory: latex
        run: |
          if [ ! -s build/main.pdf ]; then
            echo "::error::latex build did not produce build/main.pdf"
            exit 1
          fi
          file build/main.pdf

      - name: Smoke-check PDF content with pdftotext
        working-directory: latex
        run: |
          # A successful build that produced a PDF with all body
          # text as blank rectangles (missing font, broken
          # microtype) would still upload. Run pdftotext to extract
          # the first page of text and assert non-trivial content.
          set -e
          text=$(pdftotext -l 1 build/main.pdf - 2>/dev/null || true)
          if [ -z "$text" ]; then
            echo "::error::pdftotext extracted no text from build/main.pdf. The PDF may have a broken font or rasterized content."
            exit 1
          fi
          if [ $(printf "%s" "$text" | wc -w) -lt 10 ]; then
            echo "::error::pdftotext extracted fewer than 10 words from page 1. The PDF may be near-empty."
            echo "--- extracted text ---"
            echo "$text"
            echo "--- end ---"
            exit 1
          fi
          echo "pdftotext smoke check passed: $(printf '%s' "$text" | wc -w) words on page 1."

      - name: Upload PDF artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rccos-documentation
          path: latex/build/main.pdf
          retention-days: 14
