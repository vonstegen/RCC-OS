name: latex-build

# Builds the LaTeX documentation layer with TeX Live (pdflatex +
# latexmk + biber) and uploads the resulting PDF as a workflow
# artifact. Action refs are pinned to 40-char SHAs.

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - 'latex/**'
      - 'docs/**'
      - '.github/workflows/latex-build.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'latex/**'
      - 'docs/**'
      - '.github/workflows/latex-build.yml'
  workflow_dispatch:

jobs:
  build-pdf:
    name: Build RCC-OS PDF
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-science \
            texlive-publishers \
            texlive-bibtex-extra \
            biber \
            latexmk \
            make \
            poppler-utils \
            lmodern

      - name: Build
        working-directory: latex
        run: make

      - name: Verify PDF was produced
        working-directory: latex
        run: |
          if [ ! -s build/main.pdf ]; then
            echo "::error::latex build did not produce build/main.pdf"
            exit 1
          fi
          file build/main.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rccos-documentation
          path: latex/build/main.pdf
          retention-days: 14
