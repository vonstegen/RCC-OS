name: upstream-advisories

# Reports known security advisories in the in-tree baseline/
# snapshot. Non-gating: an advisory never fails this workflow, and
# this workflow is not a required status check. It exists so we have
# an auditable record of upstream dependency state without coupling
# the release gate to upstream's audit cadence.
#
# Action refs are pinned to 40-char commit SHAs.

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Weekly Wednesday 06:17 UTC; complements the Monday deterministic run.
    - cron: "17 6 * * 3"
  workflow_dispatch:

jobs:
  baseline-audit:
    name: Baseline dependency advisories
    runs-on: ubuntu-latest
    # observe: a finding must never fail the workflow.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: baseline/.nvmrc
          cache: npm
          cache-dependency-path: baseline/package-lock.json

      - name: Install root dependencies
        working-directory: baseline
        run: npm ci

      - name: Install browser host dependencies
        working-directory: baseline
        run: npm ci --prefix addons/resonant-browser-host

      - name: Audit root dependencies (informational)
        working-directory: baseline
        run: npm audit --json || true

      - name: Audit browser host dependencies (informational)
        working-directory: baseline
        run: npm audit --prefix addons/resonant-browser-host --json || true

      - name: Summarize
        if: always()
        run: |
          echo "::notice::Baseline dependency advisories are reported only."
          echo "::notice::See the run log for the npm audit JSON. Resolution lives upstream."
